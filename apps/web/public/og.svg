<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080f"/>
      <stop offset="50%" stop-color="#0a1428"/>
      <stop offset="100%" stop-color="#06101e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a3d"/>
      <stop offset="50%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#4cc9f0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="150" r="300" fill="#ff7a3d" opacity="0.03"/>
  <circle cx="1000" cy="480" r="250" fill="#4cc9f0" opacity="0.03"/>

  <!-- Mapa estilizado (lado izquierdo) -->
  <g transform="translate(80, 80)">
    <!-- Base del mapa -->
    <rect x="0" y="0" width="520" height="470" rx="12" fill="#0a1428" stroke="#1a2a3a" stroke-width="2"/>

    <!-- Grilla sutil -->
    <g stroke="#1a2a3a" stroke-width="0.5" opacity="0.5">
      <line x1="0" y1="0" x2="520" y2="470"/>
      <line x1="520" y1="0" x2="0" y2="470"/>
    </g>

    <!-- Marcadores de ejemplo -->
    <g filter="url(#glow)">
      <!-- M6.7 - grande -->
      <circle cx="180" cy="200" r="28" fill="url(#accent)" opacity="0.9"/>
      <text x="180" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#05080f">6.7</text>
      <circle cx="180" cy="200" r="36" fill="none" stroke="#ff7a3d" stroke-width="2" opacity="0.6"/>

      <!-- M4.8 -->
      <circle cx="350" cy="120" r="18" fill="#ff8a3d"/>
      <text x="350" y="127" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#05080f">4.8</text>

      <!-- M5.2 -->
      <circle cx="120" cy="340" r="20" fill="#ff5f3d"/>
      <text x="120" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff">5.2</text>

      <!-- M3.9 -->
      <circle cx="420" cy="300" r="14" fill="#ffd93d"/>
      <text x="420" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#05080f">3.9</text>

      <!-- M4.1 -->
      <circle cx="280" cy="400" r="16" fill="#ff8a3d"/>
      <text x="280" y="407" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#05080f">4.1</text>
    </g>

    <!-- Leyenda mini -->
    <g font-family="system-ui, sans-serif" font-size="11" fill="#888">
      <text x="16" y="450">Perú • 11 eventos • EN VIVO</text>
    </g>
  </g>

  <!-- Panel lateral (lado derecho) -->
  <g transform="translate(650, 80)">
    <!-- Título -->
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#fff">Sismos Live</text>
    <text x="0" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#aaa">Monitoreo sísmico en tiempo real</text>

    <!-- Badges de fuentes -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="100" height="28" rx="6" fill="#0a1428" stroke="#4cc9f0" stroke-width="1.5"/>
      <text x="50" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4cc9f0">USGS REST</text>

      <rect x="110" y="0" width="100" height="28" rx="6" fill="#0a1428" stroke="#ff7a3d" stroke-width="1.5"/>
      <text x="160" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#ff7a3d">EMSC WS</text>
    </g>

    <!-- Estadísticas -->
    <g transform="translate(0, 140)" font-family="system-ui, sans-serif">
      <text x="0" y="0" font-size="13" fill="#888">ESTADÍSTICAS (7 días)</text>
      <g transform="translate(0, 28)">
        <text x="0" y="0" font-size="24" font-weight="700" fill="#fff">11</text>
        <text x="0" y="24" font-size="12" fill="#888">eventos totales</text>
      </g>
      <g transform="translate(0, 70)">
        <text x="0" y="0" font-size="24" font-weight="700" fill="#ff7a3d">6.7</text>
        <text x="0" y="24" font-size="12" fill="#888">magnitud máxima</text>
      </g>
      <g transform="translate(0, 112)">
        <text x="0" y="0" font-size="24" font-weight="700" fill="#4cc9f0">4.2</text>
        <text x="0" y="24" font-size="12" fill="#888">promedio</text>
      </g>
      <g transform="translate(200, 70)">
        <text x="0" y="0" font-size="24" font-weight="700" fill="#ffd93d">3</text>
        <text x="0" y="24" font-size="12" fill="#888">últimas 24h</text>
      </g>
    </g>

    <!-- Filtros -->
    <g transform="translate(0, 300)" font-family="system-ui, sans-serif">
      <text x="0" y="0" font-size="13" fill="#888">FILTROS ACTIVOS</text>
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="160" height="32" rx="6" fill="#1a2a3a" stroke="#334" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">M ≥ 2.5</text>
      </g>
      <g transform="translate(170, 28)">
        <rect x="0" y="0" width="120" height="32" rx="6" fill="#1a2a3a" stroke="#334" stroke-width="1"/>
        <text x="60" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">7 días</text>
      </g>
      <g transform="translate(0, 70)">
        <rect x="0" y="0" width="160" height="32" rx="6" fill="#1a2a3a" stroke="#334" stroke-width="1"/>
        <text x="80" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Región: Perú</text>
      </g>
      <g transform="translate(170, 70)">
        <rect x="0" y="0" width="120" height="32" rx="6" fill="#1a2a3a" stroke="#334" stroke-width="1"/>
        <text x="60" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Todas</text>
      </g>
    </g>

    <!-- Temas -->
    <g transform="translate(0, 440)" font-family="system-ui, sans-serif">
      <text x="0" y="0" font-size="13" fill="#888">TEMAS DE MAPA</text>
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="90" height="32" rx="6" fill="#2d2d2d" stroke="#555" stroke-width="1"/>
        <text x="45" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Estándar</text>

        <rect x="100" y="0" width="70" height="32" rx="6" fill="#1a2a3a" stroke="#334" stroke-width="1"/>
        <text x="135" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#888">Claro</text>

        <rect x="180" y="0" width="90" height="32" rx="6" fill="#1a2a3a" stroke="#334" stroke-width="1"/>
        <text x="225" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#888">Satélite</text>

        <rect x="280" y="0" width="100" height="32" rx="6" fill="#1a2a3a" stroke="#334" stroke-width="1"/>
        <text x="330" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#888">Topográfico</text>
      </g>
    </g>
  </g>

  <!-- Footer -->
  <text x="600" y="600" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#555">
    edison-manrique.github.io/sismos-live  •  MIT License  •  Datos: EMSC · USGS
  </text>
</svg>